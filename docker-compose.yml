services:
  auditor:
    build:
      context: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - auditor-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  auditor-data:
