name: "🐛 Bug Report"
description: Report a reproducible problem in Intune Policy Auditor
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please do not include access tokens, tenant secrets, credentials,
        private keys, production policy exports containing sensitive data,
        or other confidential information.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Audit engine
        - Policy import / parsing
        - Dashboard / UI
        - Findings
        - Conflict analysis
        - Reports / exports
        - Knowledge packs
        - Tenant Mode / Microsoft Graph
        - CLI
        - Docker
        - Setup / launcher scripts
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release, tag, or commit SHA if known
      placeholder: "Example: v0.4.0 or abc1234"

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Example: 3.13.7"

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "Example: 24.x"

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Intune Policy Auditor
        2. Import ...
        3. Open ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Redact tenant-specific or confidential data before posting.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop screenshots if they help explain the problem.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this issue.
          required: true
        - label: I removed secrets, tokens, credentials, and confidential tenant data.
          required: true
