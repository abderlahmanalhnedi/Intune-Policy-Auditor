name: Dependency and source security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m pip install -e './backend[dev]' pip-audit
      - run: pip-audit
      - run: bandit -q -r backend/src
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npm audit --prefix frontend --audit-level=high
