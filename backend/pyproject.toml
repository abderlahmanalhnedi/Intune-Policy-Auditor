[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intune-policy-auditor"
version = "3.0.0.dev0"
description = "Evidence-based, read-only auditing for exported Microsoft Intune policies"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary evaluation project; see LICENSE-NOTICE.md" }
authors = [{ name = "Intune Policy Auditor contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "defusedxml>=0.7,<1",
  "click>=8.3.3,<9",
  "fastapi>=0.139.2,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "msal>=1.37,<2",
  "pillow>=12.3,<13",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.2.2,<2",
  "python-multipart>=0.0.32,<1",
  "reportlab>=5,<6",
  "requests>=2.33,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=1.3.1,<2",
  "typer>=0.15,<1",
  "urllib3>=2.7,<3",
  "uvicorn[standard]>=0.52.1,<1",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.9.4,<2",
  "mypy>=2.3,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "respx>=0.23,<1",
  "ruff>=0.16.1,<1",
  "types-defusedxml>=0.7,<1",
  "types-reportlab>=4.5,<5",
]

[project.scripts]
intune-auditor = "intune_auditor.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/intune_auditor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = [
  "B008",  # FastAPI intentionally evaluates dependency markers in defaults.
  "E501",  # Ruff formatter governs layout; localized prose and templates may be longer.
  "RUF001",  # En dashes are intentional in localized user-facing text.
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["intune_auditor"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
